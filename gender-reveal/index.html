<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emirsyah &amp; Tifani’s Gender Reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf6f9;--ink:#737373;--mute:#737373;--glass:#fffffff2;--line:#7373731f;--a:#f795a3;--a2:#fedbe3;--boy:#539ce3;--girl:#f795a3;--sw-boy:#c6e5fe;--sw-girl:#fedde5;
--script:'Brittany Signature','Brittany He She',cursive;--brand:'DO Sans','Quicksand',sans-serif;--display:var(--script);--ui:'Quicksand',system-ui,sans-serif;--ease:cubic-bezier(.22,1,.36,1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17131a}}
:root[data-theme="dark"]{--bg:#17131a}
[data-result=boy]{--a:#539ce3;--a2:#c6e5fe}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--ui);display:flex;justify-content:center;min-height:100vh;min-height:100dvh;padding:60px 14px 24px;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--a);outline-offset:4px}
.mesh,.mesh.post{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(40px);transition:opacity 1.6s var(--ease);animation:drift 22s ease-in-out infinite alternate;
background:radial-gradient(45% 45% at 14% 14%,#fee4e7,transparent 70%),radial-gradient(45% 45% at 86% 14%,#e3f5fd,transparent 70%),radial-gradient(45% 45% at 14% 86%,#dbf3fd,transparent 70%),radial-gradient(45% 45% at 86% 86%,#efdee9,transparent 70%)}
.mesh.post{opacity:0;background:radial-gradient(45% 45% at 25% 30%,var(--a2),transparent 70%),radial-gradient(45% 45% at 78% 72%,#fde4c4,transparent 70%),radial-gradient(35% 35% at 70% 18%,var(--a),transparent 75%)}
body.done .mesh.post{opacity:.7}body.done .mesh:not(.post){opacity:0}
@keyframes drift{to{transform:translate(3%,-3%) scale(1.08)}}
.card{position:relative;z-index:1;width:100%;max-width:780px;min-height:620px;margin:auto;padding:56px 24px 34px;border-radius:48px;text-align:center;
background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.2);backdrop-filter:blur(26px) saturate(1.2);border:1px solid #ffffff99;
box-shadow:0 40px 90px -40px #3a1c2e55,0 2px 0 #ffffff80 inset;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;transition:box-shadow 1.2s var(--ease),transform 1.2s var(--ease)}
.card.glow{box-shadow:0 50px 100px -40px var(--a),0 2px 0 #ffffff80 inset;transform:scale(1.008)}
.kicker{display:flex;gap:.5em 1.6em;justify-content:center;flex-wrap:wrap;margin:0;padding:0 .5em;font:400 clamp(10px,2.9vw,15px)/1.9 var(--brand);letter-spacing:.24em;color:var(--ink)}
.b{color:var(--boy)}.g{color:var(--girl)}
.names{font:400 clamp(1.4rem,9vw,2.0rem)/1.7 var(--script);color:var(--ink);margin:16px 0 10px;padding:0 .3em}
h1{font:400 clamp(11px,3.2vw,15px)/1.5 var(--brand);letter-spacing:.3em;padding-left:.3em;margin:8px 0 0;color:var(--ink)}
.big{font:400 clamp(7rem,34vw,13rem)/1 'Brittany He She','Brittany Signature',cursive;letter-spacing:0;line-height:1.4;color:var(--a);padding:.05em .15em;margin:.1em 0 .15em}
#post:not(.hidden){animation:bloom 1.2s var(--ease) both}
@keyframes bloom{from{opacity:0;filter:blur(16px);transform:translateY(16px) scale(.97)}to{opacity:1;filter:none;transform:none}}
.sub{margin:12px 0 0;color:var(--mute);font-size:15px;line-height:1.5}
.verdict{display:inline-block;margin:24px 0 0;padding:12px 28px;border-radius:999px;font:500 clamp(1rem,3.8vw,1.3rem)/1.3 var(--ui);background:var(--glass);border:1px solid var(--line);color:var(--ink);animation:bloom 1s var(--ease) .5s both}
.verdict.win{background:var(--a2);border-color:transparent;color:var(--ink);box-shadow:0 18px 40px -16px var(--a)}
.hidden{display:none!important}
.pills,.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;row-gap:12px}
.pill,.cta{border-radius:999px;padding:12px 22px;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--glass);transition:transform .5s var(--ease),background .4s,color .4s,border-color .4s}
.pill:hover,.cta:hover{transform:translateY(-2px)}
.pill[aria-pressed=true]{background:var(--a);border-color:var(--a);color:#fff}
.pill.boy[aria-pressed=true]{background:var(--boy);border-color:var(--boy)}.pill.girl[aria-pressed=true]{background:var(--girl);border-color:var(--girl)}
.cta.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{position:relative;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;margin:32px 0}
.cat{width:clamp(92px,25vw,168px);transition:transform 1s var(--ease)}
.cat svg{width:100%;height:auto;display:block;overflow:visible}
.cat.lean.l{transform:translateX(10px) rotate(3deg)}.cat.lean.r{transform:translateX(-10px) rotate(-3deg)}
.cat.party{animation:hop 1.4s ease-in-out infinite;--open:0;--happy:1}.cat.party.r{animation-delay:.25s}
@keyframes hop{50%{transform:translateY(-10px)}}
.eyes-open{opacity:var(--open,1);transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
.eyes-happy{opacity:var(--happy,0)}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.tail{transform-box:fill-box;transform-origin:10% 90%;animation:sway 3.2s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(9deg)}}
.center{position:relative;width:min(40vw,190px);aspect-ratio:1;flex:none;display:grid;place-items:center;margin:0 4px}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#prog{transition:stroke .6s}
.seal{width:80%;aspect-ratio:1;border-radius:50%;border:1px solid #ffffffcc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
background:radial-gradient(circle at 30% 25%,#fff,#fdeaf1 55%,#e6efff);box-shadow:0 24px 50px -18px #e0709a99,0 0 0 8px #ffffff55;color:#737373;animation:float 4s ease-in-out infinite;transition:transform .6s var(--ease),box-shadow .6s}
.seal:hover{transform:scale(1.05);box-shadow:0 30px 60px -18px #e0709acc,0 0 0 10px #ffffff66}
.seal:disabled{cursor:not-allowed;opacity:.65;animation:none;transform:none}
@keyframes float{50%{transform:translateY(-5px)}}
.seal b{font:400 1rem/1 var(--brand);letter-spacing:.32em;margin-right:-.32em}.seal small{font-size:11px;color:#7b7278;margin-top:6px}
.count{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.count small{font-size:12px;color:var(--mute)}
#num{font:500 clamp(3.2rem,14vw,4.6rem)/1 var(--ui);color:var(--ink);transition:transform .35s var(--ease)}
.emblem{position:absolute;inset:8%;border-radius:50%;background:#ffffffcc;border:1px solid #fff;box-shadow:0 20px 40px -20px var(--a);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:bloom 1s var(--ease) both;color:#737373}
.emblem .crown{font-size:1.7rem;line-height:1}.emblem small{font:400 10px var(--brand);letter-spacing:.28em;margin-right:-.28em;color:#737373}.emblem .hs{color:var(--a);font-size:3rem;line-height:1.4}
.mote{position:absolute;border-radius:50%;background:radial-gradient(#fff,var(--a2) 60%,transparent);animation:mote 2.2s ease-out forwards;pointer-events:none}
@keyframes mote{0%{transform:translateY(20px) scale(.4);opacity:0}40%{opacity:.9}100%{transform:translateY(-90px) scale(1.1);opacity:0}}
.flash{position:absolute;inset:0;background:radial-gradient(circle,#fff,#ffffffd9 55%,transparent);opacity:0;pointer-events:none;z-index:30;transition:opacity .8s var(--ease)}
.flash.on{opacity:1}
.hint{font-size:13px;color:var(--mute);margin:18px 0 0;min-height:1.6em}
.mute-btn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:40;border-radius:999px;padding:9px 16px;font-size:13px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}

<script>
/* ===== EDIT THESE ===== */
const CONFIG = {
  names: 'Emirsyah & Tifani',
  result: 'Z2lybA==',   // base64 of "girl" or "boy" (btoa('boy') = Ym95). Keeps the answer out of plain sight in view-source.

/* ====================== */
const $ = id => document.getElementById(id);
const RESULT = (atob(CONFIG.result) === 'boy') ? 'boy' : 'girl';
const COPY = {
  girl: { word: 'she', line: 'Our little princess is on her way ♡', small: 'BABY GIRL', name: 'she', crown: '👑' },
  boy:  { word: 'he',  line: 'Our little prince is on his way ♡',   small: 'BABY BOY',  name: 'he',   crown: '🤴' },

const isHost = location.hash === '#host';
let state = 'idle', sound = true, ac = null, raf = 0, moteT = 0, waitT = 0, loadedBefore = false;

document.title = CONFIG.names.replace('&', '&') + '’s Gender Reveal';
$('names').textContent = CONFIG.names + '’s';
$('names2').textContent = CONFIG.names;
$('word').textContent = COPY.word; $('tagline').textContent = COPY.line;
$('emSmall').textContent = COPY.small; $('emName').textContent = COPY.name; $('crown').textContent = COPY.crown;

/* ---- storage-safe guess ---- */
let guess = null;
try { guess = localStorage.getItem('grGuess'); } catch (e) {}
function setGuess(g) {
  guess = g; try { localStorage.setItem('grGuess', g); } catch (e) {}
  document.querySelectorAll('.pill').forEach(p => p.setAttribute('aria-pressed', p.dataset.g === g));
  tone(g === 'boy' ? 659.25 : 783.99, .4, 0, .05);
}
document.querySelectorAll('.pill').forEach(p => p.onclick = () => state === 'idle' && setGuess(p.dataset.g));
if (guess) setGuess(guess);

/* ---- audio (unlocked on first touch) ---- */
function ctx() {
  if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
addEventListener('pointerdown', () => ctx(), { once: true });
function tone(f, d = .8, delay = 0, v = .08) {
  if (!sound) return;
  try {
    const c = ctx(); if (!c) return; const t = c.currentTime + delay;
    const o = c.createOscillator(), h = c.createOscillator(), g = c.createGain(), hg = c.createGain();
    o.type = 'sine'; h.type = 'triangle'; o.frequency.value = f; h.frequency.value = f * 2;

    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); h.connect(hg); hg.connect(g); g.connect(c.destination);

  } catch (e) {}
}
const TICKS = { 10: 261.63, 9: 293.66, 8: 329.63, 7: 349.23, 6: 392, 5: 523.25, 4: 587.33, 3: 659.25, 2: 698.46, 1: 783.99 };
function chimeFanfare() { [523.25, 659.25, 783.99, 987.77, 1046.5, 1318.51].forEach((f, i) => tone(f, 1.6, i * .1, .085)); }
function toggleSound() {
  sound = !sound; const b = $('snd');
  b.textContent = sound ? 'Chimes on' : 'Muted'; b.setAttribute('aria-pressed', sound);
}

/* ---- scheduled live reveal ---- */
function fmt(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000)), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  const p = n => String(n).padStart(2, '0');
  return (d ? d + 'd ' : '') + p(h) + ':' + p(m) + ':' + p(x);
}
function tickWait() {
  const left = new Date(CONFIG.revealAt) - Date.now();
  if (left <= 0) { clearInterval(waitT); $('seal').disabled = false; $('sealSub').textContent = 'Tap to begin';
    if (loadedBefore && state === 'idle') start(); else $('hint').textContent = 'The moment has arrived. Tap Unveil.'; return; }
  $('hint').textContent = 'Live reveal in ' + fmt(left);
}
if (CONFIG.revealAt && new Date(CONFIG.revealAt) - Date.now() > 0) {
  loadedBefore = true;
  if (!isHost) { $('seal').disabled = true; $('sealSub').textContent = 'Opens soon'; }
  tickWait(); waitT = setInterval(tickWait, 1000);
}

/* ---- sequence ---- */
function start() {
  if (state !== 'idle') return; state = 'counting'; ctx();
  $('seal').classList.add('hidden'); $('count').classList.remove('hidden'); $('guess').classList.add('hidden');
  $('card').classList.add('glow'); $('catL').classList.add('lean'); $('catR').classList.add('lean');
  $('hint').textContent = 'Listening closely for the secret…';
  moteT = setInterval(() => {
    const m = document.createElement('div'), s = Math.random() * 7 + 4;
    m.className = 'mote'; m.style.cssText = `width:${s}px;height:${s}px;left:calc(50% + ${(Math.random() - .5) * 220}px);top:calc(50% + ${(Math.random() - .5) * 60 + 20}px)`;
    $('motes').appendChild(m); setTimeout(() => m.remove(), 2200);
  }, 220);
  const dur = CONFIG.seconds * 1000, C = 464.955, t0 = performance.now(); let last = CONFIG.seconds + 1;
  (function step(now) {
    const e = now - t0, p = Math.min(e / dur, 1);
    $('prog').style.strokeDashoffset = C * (1 - p);
    const sl = Math.max(1, Math.ceil((dur - e) / 1000));
    if (sl !== last && e < dur) {
      last = sl; $('num').textContent = sl; $('live').textContent = sl;
      $('num').style.transform = 'scale(1.18)'; setTimeout(() => $('num').style.transform = '', 180);
      tone(TICKS[sl] || 523.25, .75, 0, .07);
    }
    p < 1 ? raf = requestAnimationFrame(step) : finale();
  })(t0);
}
function finale() {
  state = 'revealed'; clearInterval(moteT);
  $('flash').classList.add('on'); chimeFanfare();
  setTimeout(() => {
    document.body.dataset.result = RESULT; $('card').dataset.result = RESULT;
    document.body.classList.add('done'); $('card').classList.remove('glow'); $('card').classList.add('done');
    $('pre').classList.add('hidden'); $('preFoot').classList.add('hidden'); $('post').classList.remove('hidden');
    $('count').classList.add('hidden'); $('emblem').classList.remove('hidden');
    ['catL', 'catR'].forEach(i => { $(i).classList.remove('lean'); $(i).classList.add('party'); });
    $('hint').classList.add('hidden'); $('after').classList.remove('hidden'); $('after').style.display = 'flex';
    if (guess) { const win = guess === RESULT, v = $('verdict'); v.textContent = win ? 'You guessed it. Well done! 🎉' : 'Not this time, but what a sweet surprise!'; v.classList.toggle('win', win); v.classList.remove('hidden'); if (win) setTimeout(() => { burst(70); tone(1318.51, 1.2, 0, .08); tone(1567.98, 1.4, .12, .07); }, 900); }
    $('live').textContent = "It's a " + RESULT + '!';
    burst(190);
  }, 260);
  setTimeout(() => $('flash').classList.remove('on'), 750);
}
function reset() {
  cancelAnimationFrame(raf); clearInterval(moteT); state = 'idle';
  document.body.classList.remove('done'); $('card').classList.remove('glow', 'done');
  $('post').classList.add('hidden'); $('pre').classList.remove('hidden'); $('preFoot').classList.remove('hidden'); $('guess').classList.remove('hidden');
  $('count').classList.add('hidden'); $('emblem').classList.add('hidden'); $('seal').classList.remove('hidden');
  $('prog').style.strokeDashoffset = 464.955; $('num').textContent = CONFIG.seconds;
  ['catL', 'catR'].forEach(i => $(i).classList.remove('lean', 'party'));
  $('after').classList.add('hidden'); $('after').style.display = ''; $('hint').classList.remove('hidden');
  $('hint').textContent = 'Tap the button to begin'; $('verdict').textContent = ''; $('verdict').classList.add('hidden'); $('verdict').classList.remove('win'); parts = [];
}
async function share() {
  const data = { title: CONFIG.names + '’s Gender Reveal', text: 'Come and find out with us! 🐾', url: location.href.split('#')[0] };
  try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(data.url); $('shareBtn').textContent = 'Link copied ✓'; } } catch (e) {}
}

/* ---- confetti ---- */
const cv = $('fx'), g2 = cv.getContext('2d'); let parts = [], loop = false, dpr = 1;

addEventListener('resize', fit); fit();
const PET = { girl: ['#f795a3', '#fedbe3', '#fbc2c1', '#f0858a'], boy: ['#539ce3', '#c6e5fe', '#97add0', '#6c85ac'] }, GOLD = ['#f8cba3', '#fbe0c4', '#f5b98a'];
function mk(fromBurst) {
  const r = Math.random(), p = {};
  if (fromBurst) { const a = Math.random() * 6.283, s = Math.random() * 14 + 5; p.x = innerWidth / 2 + (Math.random() - .5) * 80; p.y = innerHeight / 2; p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s - 6; }
  else { p.x = Math.random() * innerWidth; p.y = -20; p.vx = (Math.random() - .5) * 2; p.vy = Math.random() * 2 + 1.4; }
  p.t = r < .55 ? 'p' : r < .85 ? 'g' : 'w'; const pal = PET[RESULT];
  p.c = p.t === 'p' ? pal[Math.floor(Math.random() * pal.length)] : p.t === 'g' ? GOLD[Math.floor(Math.random() * 3)] : (Math.random() > .4 ? pal[0] : '#f8cba3');
  p.s = p.t === 'p' ? Math.random() * 7 + 7 : p.t === 'g' ? Math.random() * 5 + 4 : Math.random() * 3 + 3;
  p.rot = Math.random() * 6.28; p.rv = (Math.random() - .5) * .06; p.ph = Math.random() * 6.28; p.o = 1; return p;
}
function burst(n) { for (let i = 0; i < n; i++) parts.push(mk(true)); if (!loop) { loop = true; requestAnimationFrame(frame); } }
function frame() {
  g2.clearRect(0, 0, innerWidth, innerHeight);
  if (state === 'revealed' && parts.length < 160 && Math.random() < .35) parts.push(mk(false));
  parts = parts.filter(p => p.y < innerHeight + 30 && p.o > .01);
  for (const p of parts) {
    p.vx *= .985; p.vy = Math.min(p.vy + .22, 3.8); p.ph += .03; p.x += p.vx + Math.sin(p.ph) * .9; p.y += p.vy; p.rot += p.rv;
    if (p.y > innerHeight - 60) p.o = Math.max(0, (innerHeight + 20 - p.y) / 80);
    g2.save(); g2.globalAlpha = p.o; g2.translate(p.x, p.y); g2.rotate(p.rot); g2.fillStyle = p.c; const s = p.s; g2.beginPath();

    else if (p.t === 'g') { g2.moveTo(0, -s); g2.lineTo(s * .7, 0); g2.lineTo(0, s); g2.lineTo(-s * .7, 0); g2.closePath(); }
    else { g2.ellipse(0, s * .5, s * 1.1, s * .85, 0, 0, 6.283); [[-s, -s * .7], [0, -s * 1.1], [s, -s * .7]].forEach(([x, y]) => { g2.moveTo(x + s * .45, y); g2.arc(x, y, s * .45, 0, 6.283); }); }
    g2.fill(); g2.restore();
  }
  (parts.length || state === 'revealed') ? requestAnimationFrame(frame) : loop = false;
}
