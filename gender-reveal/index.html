:root[data-theme="dark"]{--bg:#17131a}
[data-result=boy]{--a:#539ce3;--a2:#c6e5fe}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--ui);display:flex;justify-content:center;align-items:center;height:100vh;height:100dvh;padding:14px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--a);outline-offset:4px}
.mesh,.mesh.post{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(40px);transition:opacity 1.6s var(--ease);animation:drift 22s ease-in-out infinite alternate;
background:radial-gradient(45% 45% at 14% 14%,#fee4e7,transparent 70%),radial-gradient(45% 45% at 86% 14%,#e3f5fd,transparent 70%),radial-gradient(45% 45% at 14% 86%,#dbf3fd,transparent 70%),radial-gradient(45% 45% at 86% 86%,#efdee9,transparent 70%)}
.mesh.post{opacity:0;background:radial-gradient(45% 45% at 25% 30%,var(--a2),transparent 70%),radial-gradient(45% 45% at 78% 72%,#fde4c4,transparent 70%),radial-gradient(35% 35% at 70% 18%,var(--a),transparent 75%)}
body.done .mesh.post{opacity:.7}body.done .mesh:not(.post){opacity:0}
@keyframes drift{to{transform:translate(3%,-3%) scale(1.08)}}
.card{position:relative;z-index:1;width:100%;max-width:780px;height:min(100%,800px);min-height:0;margin:auto;padding:calc(var(--u)*2.6) 14px calc(var(--u)*2.2);border-radius:48px;text-align:center;
background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.2);backdrop-filter:blur(26px) saturate(1.2);border:1px solid #ffffff99;
box-shadow:0 40px 90px -40px #3a1c2e55,0 2px 0 #ffffff80 inset;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;transition:box-shadow 1.2s var(--ease),transform 1.2s var(--ease)}
.card::-webkit-scrollbar{display:none}
.card.glow{box-shadow:0 50px 100px -40px var(--a),0 2px 0 #ffffff80 inset;transform:scale(1.008)}
.kicker{display:flex;gap:.5em .8em;justify-content:center;flex-wrap:wrap;margin:0;padding:0 .5em;font:400 clamp(10px,2.9vw,15px)/1.9 var(--brand);letter-spacing:.24em;color:var(--ink)}
.b{color:var(--boy)}.g{color:var(--girl)}
.names{font:400 clamp(1.0rem,9vw,1.5rem)/1.5 var(--script);color:var(--ink);margin:calc(var(--u)*.8) 0 calc(var(--u)*.4);padding:0 .3em}
h1{font:400 clamp(11px,3.2vw,15px)/1.5 var(--brand);letter-spacing:.3em;padding-left:.3em;margin:4px 0 0;color:var(--ink)}
.big{font:400 clamp(4rem,min(34vw,calc(var(--u)*13.5)),13rem)/1 'Sacramento','Brittany He She','Brittany Signature',cursive;letter-spacing:0;line-height:1.25;color:var(--a);padding:.05em .15em;margin:calc(var(--u)*.4) 0}
#post:not(.hidden){animation:bloom 1.2s var(--ease) both}
@keyframes bloom{from{opacity:0;filter:blur(16px);transform:translateY(16px) scale(.97)}to{opacity:1;filter:none;transform:none}}
.sub{margin:calc(var(--u)*.8) 0 0;color:var(--mute);font-size:15px;line-height:1.5}
.verdict{display:inline-block;margin:calc(var(--u)*1.4) 0 0;padding:9px 24px;border-radius:999px;font:500 clamp(.8rem,3.5vw,1.2rem)/1.3 var(--ui);background:var(--glass);border:1px solid var(--line);color:var(--ink);animation:bloom 1s var(--ease) .5s both}
.verdict.win{background:var(--a2);border-color:transparent;color:var(--ink);box-shadow:0 18px 40px -16px var(--a)}
.hidden{display:none!important}
.card.done .qline{display:none}
/* before the reveal: extra height goes above the cats, and the footer text gets room to breathe */
.sp{flex:1 1 0;min-height:0}.sp.a{flex-grow:2.4}
.card:not(.done) footer{margin-top:calc(var(--u)*1)}
.card:not(.done) footer .kicker{line-height:2}
.card:not(.done) .names{margin:calc(var(--u)*2.2) 0 calc(var(--u)*1.2)}
.card:not(.done) footer h1{margin-top:calc(var(--u)*.8);letter-spacing:.34em}
.card:not(.done) .hint{margin-top:calc(var(--u)*2.4)}
.pills,.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:calc(var(--u)*1.6);row-gap:8px}
.pill,.cta{border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:500;border:1px solid var(--line);background:var(--glass);transition:transform .5s var(--ease),background .4s,color .4s,border-color .4s}
.pill:hover,.cta:hover{transform:translateY(-2px)}
.pill[aria-pressed=true]{background:var(--a);border-color:var(--a);color:#fff}
.pill.boy[aria-pressed=true]{background:var(--boy);border-color:var(--boy)}.pill.girl[aria-pressed=true]{background:var(--girl);border-color:var(--girl)}
.cta.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{position:relative;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;margin:calc(var(--u)*1.2) 0}
.cat{position:relative;width:clamp(78px,min(28vw,calc(var(--u)*20.5)),190px);transition:transform 1s var(--ease);filter:drop-shadow(0 10px 14px #78574a22)}
.cat .pic{width:100%;height:auto;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.cat .shut{position:absolute;inset:0;opacity:0;animation:blinkImg 4.8s infinite}
.cat.r .shut{animation-delay:1.7s}
.cat.r .pic{transform:scaleX(-1)}
@keyframes blinkImg{0%,93%,98%,100%{opacity:0}95.5%{opacity:1}}
.cat.party .shut{animation:none;opacity:1}
.cat.lean.l{transform:translateX(10px) rotate(3deg)}.cat.lean.r{transform:translateX(-10px) rotate(-3deg)}
.cat.party{animation:hop 1.4s ease-in-out infinite}.cat.party.r{animation-delay:.25s}
@keyframes hop{50%{transform:translateY(-10px)}}
.center{position:relative;width:min(36vw,calc(var(--u)*20),190px);aspect-ratio:1;flex:none;display:grid;place-items:center;margin:0 4px}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#prog{transition:stroke .6s}
.seal{width:80%;aspect-ratio:1;border-radius:50%;border:1px solid #ffffffcc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
background:radial-gradient(circle at 30% 25%,#fff,#fdeaf1 55%,#e6efff);box-shadow:0 24px 50px -18px #e0709a99,0 0 0 8px #ffffff55;color:#737373;animation:float 4s ease-in-out infinite;transition:transform .6s var(--ease),box-shadow .6s}
.seal:hover{transform:scale(1.05);box-shadow:0 30px 60px -18px #e0709acc,0 0 0 10px #ffffff66}
.seal:disabled{cursor:not-allowed;opacity:.65;animation:none;transform:none}
@keyframes float{50%{transform:translateY(-5px)}}
.seal b{font:400 1rem/1 var(--brand);letter-spacing:.32em;margin-right:-.32em}.seal small{font-size:11px;color:#7b7278;margin-top:6px}
.count{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.count small{font-size:12px;color:var(--mute)}
#num{font:500 clamp(2.2rem,min(14vw,calc(var(--u)*6.5)),4.6rem)/1 var(--ui);color:var(--ink);transition:transform .35s var(--ease)}
.emblem{position:absolute;inset:8%;border-radius:50%;background:#ffffffcc;border:1px solid #fff;box-shadow:0 20px 40px -20px var(--a);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:bloom 1s var(--ease) both;color:#737373}
.emblem .crown{font-size:1.7rem;line-height:1}.emblem small{font:400 10px var(--brand);letter-spacing:.28em;margin-right:-.28em;color:#737373}.emblem .hs{color:var(--a);font-size:clamp(2rem,calc(var(--u)*5.4),3rem);line-height:1.25}
.mote{position:absolute;border-radius:50%;background:radial-gradient(#fff,var(--a2) 60%,transparent);animation:mote 2.2s ease-out forwards;pointer-events:none}
@keyframes mote{0%{transform:translateY(20px) scale(.4);opacity:0}40%{opacity:.9}100%{transform:translateY(-90px) scale(1.1);opacity:0}}
.flash{position:absolute;inset:0;background:radial-gradient(circle,#fff,#ffffffd9 55%,transparent);opacity:0;pointer-events:none;z-index:30;transition:opacity .8s var(--ease)}
.flash.on{opacity:1}
.hint{font-size:13px;color:var(--mute);margin:calc(var(--u)*1) 0 0;min-height:1.4em}
.mute-btn{position:absolute;top:12px;right:12px;z-index:40;border-radius:999px;width:42px;height:42px;padding:0;display:grid;place-items:center;color:var(--ink);border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
